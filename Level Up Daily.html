<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Level Up">
<title>Level Up Daily</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2e;--mu:#6a6f8a;--ac:#6c4cff;--ac2:#ff7a3d;--ok:#16a34a;--bd:#e3e5f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--card:#181b30;--tx:#eef0ff;--mu:#9a9fc2;--ac:#8b73ff;--bd:#272b49;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1020;--card:#181b30;--tx:#eef0ff;--mu:#9a9fc2;--ac:#8b73ff;--bd:#272b49;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:4px 0 10px;font-size:1.25rem}h3{margin:0 0 6px;font-size:1rem}.mu{color:var(--mu);font-size:.88rem}
.it{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}.it:last-child{border:0}
.cb{width:26px;height:26px;border-radius:9px;border:2px solid var(--ac);flex:none;display:grid;place-items:center;font-size:15px;color:#fff;transition:.2s}
.it.on .cb{background:var(--ok);border-color:var(--ok);transform:scale(1.12)}.it.on .t{text-decoration:line-through;opacity:.6}
.xp{font-size:.75rem;color:var(--ac2);font-weight:700}
button,select,input,textarea{font:inherit;color:var(--tx)}
.b{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer}.b.g{background:var(--bd);color:var(--tx)}.b:active{transform:scale(.95)}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;margin:4px 0}textarea{min-height:70px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;border:0;font-size:1.25rem;color:var(--mu);padding:2px 0;cursor:pointer}nav small{display:block;font-size:.62rem}nav .a{color:var(--ac);transform:translateY(-3px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{padding:6px 11px;border-radius:99px;background:var(--bd);cursor:pointer;font-size:.85rem}.chip.a{background:var(--ac);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:.8rem;background:var(--bd)}
.bd{display:inline-block;padding:6px 10px;margin:3px;border-radius:12px;background:var(--bd);font-size:.85rem}.bd.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}.bd:not(.on){opacity:.5}
#lv{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;text-align:center;color:#fff}#lv.s{display:grid}#lv div{animation:pop .7s}@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1)}}
#lv b{font-size:4rem;display:block}.big{font-size:2.6rem;font-weight:800;text-align:center}
</style></head><body>
<header><div class="row"><b id="hl"></b><span class="sp"></span><span id="hs"></span><button class="b g" onclick="th()" aria-label="Toggle theme">🌓</button></div><div class="bar"><i id="hb"></i></div></header>
<main id="m"></main><nav id="nv"></nav>
<div id="lv" onclick="this.classList.remove('s')"><div><b>🎉</b><h1 id="lt"></h1><p>Tap to keep going!</p></div></div>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const k=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>k(new Date()),dow=()=>new Date().getDay(),DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DEF={xp:0,spent:0,d:{},j:{},bj:{},sk:{},pr:[],shop:[],b:{},theme:'',nt:'18:00',cs:today(),
routine:{m:['Get out of bed on time','Make my bed','Get ready for school','Say a short prayer','Remember one thing I’m grateful for'],a:['Complete homework and responsibilities'],e:['Reflect on my day','Write down one thing I did well','Prepare for tomorrow','Get enough sleep']},
sched:{1:['Warm-up: 2 min march, 10 arm circles, 10 leg swings/side, 10 easy squats','Bodyweight squats — 2×10','Wall or knee push-ups — 2×6–10','Glute bridges — 2×12','Bird dogs — 2×8/side','Plank — 2×15–20 sec'],
2:['Stickhandling — 5 min','Forehand & backhand control — 5 min','Passing — 5 min','Shooting — 5 min','Skating balance & control — 5 min'],
3:['Gentle stretching','Easy walk or relaxed movement','Drink water regularly','Get enough sleep','No hard workout today'],
4:['Warm-up: 2 min march, arm circles, leg swings, easy squats','Reverse lunges — 2×6/leg','Wall or knee push-ups — 2×6–10','Calf raises — 2×12','Dead bugs — 2×8/side','Side plank — 2×10–15 sec/side'],
5:['Stickhandling — 5 min','Passing — 5 min','Shooting — 5 min','Turning & stopping — 5 min','Skating technique — 5 min'],
6:['Play hockey!','Practice your favorite skills','Work on something from this week','Enjoy it — no performance pressure'],
0:['Rest from structured training','Relax','Spend time with family','Reflect on the week']}};
let S;try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem('lud')||'{}'))}catch(e){S=structuredClone(DEF)}
const sv=()=>{try{localStorage.setItem('lud',JSON.stringify(S))}catch(e){}};
const BIB=[['Matthew 5:1–12','Being a good person and following Jesus','What does Jesus teach me here?','How can I apply this today?'],['Ephesians 4:25–32','Honesty, kindness, forgiveness, and controlling my words','Did I use my words to help people today?','Is there someone I need to apologize to?'],['Proverbs 16','Wisdom, humility, and trusting God','Am I making good decisions?','Am I trusting God?'],['Luke 6:27–36','Loving others and treating people well','How can I treat someone better today?','Can I show kindness to someone who annoys me?'],['1 Corinthians 13','Love, patience, and kindness','Was I patient today?','Did I show genuine kindness?'],['Philippians 2:1–11','Humility and putting others first','Did I put others down or build them up?','How can I be more humble?'],['Psalm 23','Trusting God and finding peace','What am I thankful for?','What do I need God’s help with?']];
const bi=d=>BIB[(d+6)%7];
const KIND=['Reflect on how you treated others.','Give someone a genuine compliment.','Help someone without being asked.','Include someone who feels left out.','Avoid gossip and hurtful jokes.','Thank someone who has helped you.','Do something kind for your family.'];
const CHAR=['Be honest','Keep promises','Respect people','Listen before responding','Admit when I’m wrong','Apologize when necessary','Don’t make fun of people to get laughs','Encourage others'];
const COUR=['Write down three things you like about your personality.','Practice positive self-talk.','Share an opinion respectfully.','Try something new.','Stop comparing yourself to someone else.','Do something independently.','Reflect on your progress this week.','Say hello to someone new.','Ask someone about their interests.','Practice listening without interrupting.','Start a conversation.','Give someone a compliment.','Spend time with a friend.','Reflect on your progress this week.','Remember that girls are normal people, just like anyone.','Have a friendly conversation.','Ask about a hobby.','Talk about a shared interest.','Practice being yourself.','Be respectful and a good listener.','Reflect on your progress this week.','Write down what makes a good friend.','Write down what makes a healthy relationship.','Practice expressing your feelings respectfully.','Learn how to handle disappointment (it’s okay to hear “no”).','Practice accepting different opinions.','Do something thoughtful for someone.','Reflect on how you’ve grown.','Choose one habit to keep.','Celebrate your progress! 🎉'];
const SK={st:['Stickhandling','Keep the ball close with soft hands and your head up.',['Ball control','Forehand control','Backhand control','Side to side','Head up while controlling'],'Move the ball side to side 20 times without looking down, 3 rounds.'],
sh:['Shooting','Snap your wrists, shift weight forward, follow through at your target.',['Wrist shots','Accuracy','Stationary shots','Safe different positions'],'Take 20 wrist shots aiming at 4 corners; count hits.'],
pa:['Passing','Point your stick at the target and follow through. Give soft passes you can receive.',['Forehand passing','Receiving','Accuracy','Passing while moving'],'10 forehand passes at a target from 5 steps; then 10 while moving.'],
sk:['Skating','Bend your knees, stay balanced, and build speed gradually. Practice backward skating only with supervision.',['Balance','Acceleration','Safe stopping','Turning','Backward (supervised)'],'Do 5 controlled stops and 5 turns each way, safely.'],
iq:['Hockey IQ','Think before the puck arrives: where is open space and who needs help?',['Positioning','When to pass','Finding open space','Defensive awareness','Team communication','Offense & defense jobs'],'Watch a game for 10 min. Name 3 smart passes or positions.']};
const SCH=[['school.hw','Check homework'],['school.imp','Complete important assignments'],['school.study','Study for upcoming tests'],['school.bag','Organize my backpack'],['school.prep','Prepare for tomorrow']];
const BOSS=[['Learn a new hockey skill (practice sessions)',5],['Complete my planned workouts',4],['Read the Bible every day',7],['Show kindness to five people',5],['Start three friendly conversations',3],['Complete all homework on time',5]];
const CATS={hockey:'🏒 Hockey',strength:'💪 Strength',faith:'✝️ Faith',kind:'🤝 Kindness',courage:'❤️ Courage',school:'📚 School',self:'🌟 Daily'};
const wk=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return k(d)};
let tab=0,sub='',cm=new Date(),T=null;
const lvOf=x=>Math.floor(Math.sqrt(x/50))+1,need=l=>50*l*l;
const dm=d=>S.d[d]||{};
function tg(id,x){const t=today();S.d[t]=S.d[t]||{};const was=lvOf(S.xp);if(S.d[t][id]==1){delete S.d[t][id];S.xp=Math.max(0,S.xp-x)}else{S.d[t][id]=1;S.xp+=x}sv();if(lvOf(S.xp)>was){$('lt').textContent='Level '+lvOf(S.xp)+'!';$('lv').classList.add('s')}R()}
function skip(id){const t=today();S.d[t]=S.d[t]||{};if(S.d[t][id]=='s')delete S.d[t][id];else S.d[t][id]='s';sv();R()}
const it=(id,l,x)=>{const v=dm(today())[id];return `<div class="it ${v==1?'on':''}" onclick="tg('${id}',${x})"><span class="cb">${v==1?'✓':''}</span><span class="t sp">${E(l)}</span><span class="xp">+${x}</span></div>`};
const has=o=>Object.values(o).includes(1);
function streak(){let n=0,d=new Date();if(!has(dm(k(d))))d.setDate(d.getDate()-1);while(has(dm(k(d)))){n++;d.setDate(d.getDate()-1)}return n}
function wstreak(){let n=0,d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));for(let w=0;w<60;w++){let a=0;for(let i=0;i<7;i++){const e=new Date(d);e.setDate(d.getDate()+i);if(has(dm(k(e))))a++}if(a>=3)n++;else if(w>0)break;d.setDate(d.getDate()-7)}return n}
function cnt(c,days){let n=0;const t=new Date();for(let i=0;i<(days||800);i++){const d=new Date(t);d.setDate(t.getDate()-i);const o=dm(k(d));for(const x in o)if(o[x]==1&&x.split('.')[0]==c)n++}return n}
function hdr(){const l=lvOf(S.xp),a=l>1?need(l-1):0,b=need(l);$('hl').textContent='⚔️ Level '+l;$('hs').textContent='🔥'+streak()+'  ⭐'+S.xp+' XP';$('hb').style.width=Math.min(100,(S.xp-a)/(b-a)*100)+'%'}
function R(){hdr();const N=[['🏠','Today'],['🏒','Train'],['✝️','Faith'],['🤝','Grow'],['📚','School'],['📖','Journal'],['👑','Me']];$('nv').innerHTML=N.map((n,i)=>`<button class="${i==tab?'a':''}" onclick="tab=${i};sub='';R();scrollTo(0,0)">${n[0]}<small>${n[1]}</small></button>`).join('');$('m').innerHTML=[vT,vTr,vF,vG,vS,vJ,vM][tab]()}
const chips=(arr)=>`<div class="chips">${arr.map(([i,l])=>`<span class="chip ${(sub||arr[0][0])==i?'a':''}" onclick="sub='${i}';R()">${l}</span>`).join('')}</div>`;
const cdy=()=>Math.floor((new Date(today())-new Date(S.cs))/864e5)%30;
function vT(){const d=dow(),b=bi(d),cd=cdy(),r=S.routine;
const g=(t,a)=>`<div class="card"><h3>${t}</h3>${a}</div>`;
return `<h2>Hi, champ! ${DN[d]} 🏒</h2><p class="mu">Do what you can. Missed a day? Just restart — no penalty.</p>`+
g('☀️ Morning',r.m.map((x,i)=>it('self.m'+i,x,10)).join(''))+
g('🎒 After school',r.a.map((x,i)=>it('school.a'+i,x,15)).join('')+it('hockey.train','Today’s activity: '+(d==1||d==4?'Strength day':d==3||d==0?'Recovery / rest':'Hockey'),20)+`<div class="mu" style="padding:4px"><button class="b g" onclick="skip('hockey.skip')">${dm(today())['hockey.skip']=='s'?'Skipped ✓ (tired — totally fine)':'Too tired? Skip guilt-free'}</button></div>`+it('faith.read','Bible reading: '+b[0],15)+it('kind.chal','Kindness: '+KIND[d],15)+it('courage.chal','Courage day '+(cd+1)+': '+COUR[cd],15))+
g('🌙 Evening',r.e.map((x,i)=>it('self.e'+i,x,10)).join(''))}
function vTr(){const o=[['sch','📅 Week'],['sk','🏒 Skills']];let h=chips(o);const s=sub||'sch';
if(s=='sch'){const d=+(S.tv??dow());h+=`<div class="chips">${[1,2,3,4,5,6,0].map(i=>`<span class="chip ${i==d?'a':''}" onclick="S.tv=${i};S.ed=0;R()">${DN[i].slice(0,3)}</span>`).join('')}</div>`;const c=[1,4].includes(d)?'strength':[2,5,6].includes(d)?'hockey':'self';
h+=`<div class="card"><h2>${DN[d]}${d==6?' — FUN DAY':d==0?' — REST':''}</h2><p class="mu">⚠️ Beginner starting points. Have a parent or coach check your technique. Lighten or skip when tired, stop if anything hurts, never train through pain. If you have a tough practice or game, adjust — don’t add extra. This is about getting stronger and better, not about weight or looks.</p>`;
if(S.ed)h+=`<textarea id="se" style="min-height:160px">${E(S.sched[d].join('\n'))}</textarea><button class="b" onclick="S.sched[${d}]=$('se').value.split('\\n').filter(x=>x.trim());S.ed=0;sv();R()">Save</button>`;
else{h+=(d==dow()?S.sched[d].map((x,i)=>it(c+'.w'+d+'_'+i,x,3)).join(''):S.sched[d].map(x=>`<div class="it"><span class="t">• ${E(x)}</span></div>`).join('')+'<p class="mu">Check-offs unlock on the actual day.</p>')+`<button class="b g" onclick="S.ed=1;R()">✏️ Edit this day</button>`}
return h+'</div>'}
return h+Object.entries(SK).map(([i,s])=>{const p=S.sk[i]||{lv:0,n:0};return `<div class="card"><h3>${s[0]}</h3><p class="mu">${s[1]}</p><p>${s[2].map(x=>'<span class="bd">'+x+'</span>').join('')}</p><p>🎯 <b>Challenge:</b> ${s[3]}</p><div class="row"><span>${'⭐'.repeat(p.lv)}${'☆'.repeat(5-p.lv)} · ${p.n} sessions</span><span class="sp"></span><button class="b g" onclick="sk('${i}',-1)">−</button><button class="b g" onclick="sk('${i}',1)">+</button></div><button class="b" style="margin-top:8px" onclick="ses('${i}')">+1 practice session (+10 XP)</button></div>`}).join('')}
function sk(i,v){const p=S.sk[i]=S.sk[i]||{lv:0,n:0};p.lv=Math.max(0,Math.min(5,p.lv+v));sv();R()}
function ses(i){const p=S.sk[i]=S.sk[i]||{lv:0,n:0};p.n++;sv();S.d[today()]=S.d[today()]||{};tg('hockey.s'+i+'_'+p.n,10)}
function vF(){const d=dow(),b=bi(d),j=S.bj[today()]||'';let dots='';for(let i=0;i<7;i++){const e=new Date(wk());e.setDate(e.getDate()+i);dots+=`<span class="bd ${dm(k(e))['faith.read']==1?'on':''}">${DN[(i+1)%7].slice(0,2)}</span>`}
return `<h2>✝️ ${DN[d]}: ${b[0]}</h2><div class="card"><p>${b[1]}</p>${it('faith.read','I read it today',15)}<h3>Reflect</h3><p>• ${b[2]}<br>• ${b[3]}</p><textarea placeholder="My reflection…" oninput="S.bj['${today()}']=this.value;sv()">${E(j)}</textarea></div>
<div class="card"><h3>🙏 Prayer prompts</h3><p class="mu">Thank God for one thing • Ask for help with something hard • Pray for someone else • Say sorry for something • Ask for wisdom.</p><p><i>“Dear God, thank You for another day. Help me become stronger, kinder, wiser, and more patient. Help me make good decisions, treat others with love, and grow closer to You. Help me with hockey, school, friendships, and everything I face today. In Jesus’ name, Amen.”</i></p>${it('faith.pray','I prayed today',10)}</div>
<div class="card"><h3>This week’s Bible tracker</h3>${dots}</div><div class="card"><h3>Past reflections</h3>${Object.keys(S.bj).sort().reverse().slice(0,10).map(x=>S.bj[x]?`<p class="mu"><b>${x}</b><br>${E(S.bj[x])}</p>`:'').join('')||'<p class="mu">None yet.</p>'}</div>`}
function vG(){const d=dow(),cd=cdy(),s=sub||'k';
return chips([['k','🤝 Kindness'],['c','❤️ 30-day courage']])+(s=='k'?`<div class="card"><h2>Today’s kindness</h2>${it('kind.chal',KIND[d],15)}</div><div class="card"><h3>Character checklist</h3>${CHAR.map((x,i)=>it('kind.c'+i,x,3)).join('')}</div>`:
`<div class="card"><h2>Day ${cd+1} of 30</h2>${it('courage.chal',COUR[cd],15)}<p class="mu">Courage means respect, boundaries, patience, and being okay with hearing “no.” Never pressure — just be a kind, real you.</p><button class="b g" onclick="if(confirm('Restart the 30 days?')){S.cs=today();sv();R()}">Restart program</button></div><div class="card"><h3>All 30 days</h3>${COUR.map((x,i)=>`<p class="mu" style="${i==cd?'color:var(--ac);font-weight:700':''}">${i+1}. ${x}</p>`).join('')}</div>`)}
const tf=ms=>{const s=Math.ceil(ms/1e3);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function vS(){return `<h2>📚 School</h2><div class="card"><div class="big" id="tm">${tf(T?Math.max(0,T.e-Date.now()):(S.tl||25)*6e4)}</div><div class="chips" style="justify-content:center">${[10,15,25].map(m=>`<span class="chip ${(S.tl||25)==m?'a':''}" onclick="if(!T){S.tl=${m};sv();R()}">${m} min</span>`).join('')}</div><div class="row" style="justify-content:center"><button class="b" onclick="ts()">${T?'Stop':'Start focus'}</button></div><p class="mu" style="text-align:center">Finishing a session earns XP. Keep this page open while it runs.</p></div><div class="card"><h3>Daily checklist</h3>${SCH.map(([i,l])=>it(i,l,10)).join('')}</div>`}
function ts(){if(T){clearInterval(T.i);T=null;R();return}const m=S.tl||25;T={e:Date.now()+m*6e4,m};T.i=setInterval(()=>{const l=T.e-Date.now();if(l<=0){clearInterval(T.i);const m=T.m;T=null;navigator.vibrate&&navigator.vibrate([300,100,300]);S.d[today()]=S.d[today()]||{};tg('school.f'+Date.now(),m<25?8:20);alert('Focus session done! 🎉');return}const e=$('tm');if(e)e.textContent=tf(l)},500);R()}
const Q=['What did I do well today?','What could I improve?','Did I treat people kindly?','Did I make progress with hockey?','Did I spend time with God?','What am I grateful for?','What is my goal for tomorrow?'];
function vJ(){const a=S.j[today()]||[];return `<h2>📖 Journal — ${today()}</h2><div class="card">${Q.map((q,i)=>`<h3>${i+1}. ${q}</h3><textarea oninput="jn(${i},this.value)">${E(a[i]||'')}</textarea>`).join('')}<p class="mu">Saved automatically. Answer 3+ for +15 XP.</p></div><div class="card"><h3>Past entries</h3>${Object.keys(S.j).sort().reverse().filter(x=>x!=today()).map(x=>`<details><summary>${x}</summary>${S.j[x].map((v,i)=>v?`<p class="mu"><b>${Q[i]}</b><br>${E(v)}</p>`:'').join('')}</details>`).join('')||'<p class="mu">No past entries yet.</p>'}</div>`}
function jn(i,v){const t=today(),a=S.j[t]=S.j[t]||[];a[i]=v;if(a.filter(x=>x&&x.trim()).length>=3&&dm(t)['self.journal']!=1){S.d[t]=S.d[t]||{};S.d[t]['self.journal']=1;S.xp+=15;hdr()}sv()}
function vM(){const o=[['p','📈 Progress'],['b','👑 Boss'],['cal','📅 Calendar'],['sh','🎁 Rewards'],['st','⚙️ Settings']];return chips(o)+({p:vP,b:vB,cal:vC,sh:vR,st:vSt}[sub||'p'])()}
function vP(){const l=lvOf(S.xp);const bd=[['🌱 First step',Object.values(S.d).some(has)],['🔥 3-day streak',streak()>=3],['🔥 7-day streak',streak()>=7],['⚔️ Level 5',l>=5],['✝️ 10 Bible days',cnt('faith')>=10],['🏒 10 hockey checks',cnt('hockey')>=10],['💪 10 strength checks',cnt('strength')>=10],['🤝 10 kind acts',cnt('kind')>=10],['❤️ 10 courage steps',cnt('courage')>=10],['📚 25 school tasks',cnt('school')>=25],['👑 Boss slayer',Object.values(S.b).some(x=>x.c)]];
return `<div class="card"><h3>🔥 Daily streak ${streak()} · 📆 Weekly streak ${wstreak()}</h3><p class="mu">A week counts with 3+ active days. Streaks just restart — no punishment.</p></div><div class="card"><h3>Your progress (last 7 / 30 days)</h3><p class="mu">Only compared with your own past self.</p>${Object.entries(CATS).map(([c,n])=>{const a=cnt(c,7),b=cnt(c,30);return `<div class="mu">${n}: ${a} / ${b}</div><div class="bar"><i style="width:${Math.min(100,a*8)}%"></i></div>`}).join('')}</div><div class="card"><h3>🏅 Badges</h3>${bd.map(([n,o])=>`<span class="bd ${o?'on':''}">${n}</span>`).join('')}</div>
<div class="card"><h3>🏆 Personal records</h3>${S.pr.map((p,i)=>`<div class="it"><span class="sp">${E(p[0])}: <b>${E(p[1])}</b></span><button class="b g" onclick="S.pr.splice(${i},1);sv();R()">✕</button></div>`).join('')}<input id="pn" placeholder="Record (e.g. Plank)"><input id="pv" placeholder="Value (e.g. 25 sec)"><button class="b" onclick="if($('pn').value){S.pr.push([$('pn').value,$('pv').value]);sv();R()}">Add record</button></div>`}
function vB(){const w=wk(),n=Math.floor(new Date(w)/6048e5)%6,b=BOSS[n],s=S.b[w]=S.b[w]||{n:0,c:0};return `<div class="card"><h2>👑 Weekly Boss</h2><h3>${b[0]}</h3><div class="bar"><i style="width:${Math.min(100,s.n/b[1]*100)}%"></i></div><p>${s.n} / ${b[1]}</p><div class="row"><button class="b g" onclick="bs(-1)">−</button><button class="b" onclick="bs(1)">+1 (+5 bonus XP)</button>${s.n>=b[1]&&!s.c?'<button class="b" style="background:var(--ac2)" onclick="bc()">Claim +100 XP</button>':''}</div>${s.c?'<p>✅ Defeated! Great work.</p>':''}</div>`}
function bs(v){const s=S.b[wk()],o=s.n;s.n=Math.max(0,s.n+v);S.xp=Math.max(0,S.xp+(s.n-o)*5);sv();R()}
function bc(){S.b[wk()].c=1;const was=lvOf(S.xp);S.xp+=100;sv();if(lvOf(S.xp)>was){$('lt').textContent='Level '+lvOf(S.xp)+'!';$('lv').classList.add('s')}R()}
function vC(){const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),dn=new Date(y,m+1,0).getDate();let c='',mc=0;for(let i=0;i<f;i++)c+='<span></span>';for(let i=1;i<=dn;i++){const n=Object.values(dm(k(new Date(y,m,i)))).filter(v=>v==1).length;mc+=n;c+=`<div style="${n?`background:var(--ac);color:#fff;opacity:${.45+Math.min(.55,n/12)}`:''}">${i}</div>`}
return `<div class="card"><div class="row"><button class="b g" onclick="cm=new Date(${y},${m-1},1);R()">◀</button><b class="sp" style="text-align:center">${cm.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="b g" onclick="cm=new Date(${y},${m+1},1);R()">▶</button></div><br><div class="cal">${c}</div><p class="mu">Brighter days = more goals done. Month total: ${mc} goals completed.</p></div>`}
function vR(){const c=S.xp-S.spent;return `<div class="card"><h2>🎁 Rewards shop</h2><p>Spendable XP: <b>${c}</b> <span class="mu">(your level never drops)</span></p>${S.shop.map((r,i)=>`<div class="it"><span class="sp">${E(r[0])}<br><span class="xp">${r[1]} XP</span></span><button class="b" onclick="by(${i})">Claim</button><button class="b g" onclick="S.shop.splice(${i},1);sv();R()">✕</button></div>`).join('')||'<p class="mu">Add a real-life reward below!</p>'}<input id="rn" placeholder="Reward (e.g. Pizza night)"><input id="rc" type="number" placeholder="Cost in XP" value="200"><button class="b" onclick="if($('rn').value){S.shop.push([$('rn').value,+$('rc').value||100]);sv();R()}">Add reward</button></div>`}
function by(i){if(S.xp-S.spent<S.shop[i][1])return alert('Not enough XP yet — keep going!');S.spent+=S.shop[i][1];sv();alert('Enjoy: '+S.shop[i][0]+' 🎉');R()}
function vSt(){const np='Notification' in window?Notification.permission:'unsupported';return `<div class="card"><h3>🔔 Daily reminder</h3><p class="mu"><b>Honest note:</b> this app has no server, so it can only show the 6:00 PM reminder while the page is open in your browser. True background alerts on iPhone aren’t possible here, and adding it to your Home Screen doesn’t change that. A phone alarm at 6 PM is the most reliable option.</p><p>Permission: <b>${np}</b></p><label class="mu">Time</label><input type="time" value="${S.nt}" onchange="S.nt=this.value;sv()"><button class="b" onclick="if('Notification' in window)Notification.requestPermission().then(R);else alert('Not supported on this browser.')">Enable notifications</button></div>
<div class="card"><h3>✏️ Edit routine (one per line)</h3>${[['m','Morning'],['a','After school'],['e','Evening']].map(([i,n])=>`<label class="mu">${n}</label><textarea onchange="S.routine['${i}']=this.value.split('\\n').filter(x=>x.trim());sv();R()">${E(S.routine[i].join('\n'))}</textarea>`).join('')}</div>
<div class="card"><h3>💾 Backup & restore</h3><p class="mu">Copy this text somewhere safe (Notes app). To restore, paste it here and tap Restore.</p><textarea id="bk">${E(JSON.stringify(S))}</textarea><button class="b" onclick="$('bk').select();navigator.clipboard&&navigator.clipboard.writeText($('bk').value)">Copy</button> <button class="b g" onclick="try{S=Object.assign(structuredClone(DEF),JSON.parse($('bk').value));sv();alert('Restored!');R()}catch(e){alert('That backup text isn’t valid.')}">Restore</button></div>
<div class="card"><button class="b g" onclick="if(confirm('Erase ALL progress?')){S=structuredClone(DEF);sv();R()}">Reset everything</button></div>`}
function th(){const c=document.documentElement,dk=getComputedStyle(c).colorScheme=='dark';S.theme=dk?'light':'dark';c.dataset.theme=S.theme;sv()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');if(hm==S.nt&&S.ln!=today()){S.ln=today();sv();const m='Time to level up! Check your hockey, Bible, and personal growth goals.';if('Notification' in window&&Notification.permission=='granted')new Notification('Level Up Daily',{body:m});else alert(m)}},20000);
R();
</script></body></html>
